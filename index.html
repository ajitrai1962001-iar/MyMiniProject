<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bhutan Spatial Portal</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

  <style>
    html, body {
      height: 100%;
      margin: 0;
      background: #020617;
      color: #e2e8f0;
      font-family: "Segoe UI", sans-serif;
      overflow: hidden;
    }

    /* NAVBAR */
    .navbar {
      background: #020617;
      border-bottom: 1px solid #1e293b;
      height: 56px;
    }

    .navbar-brand {
      font-weight: bold;
      color: #f8fafc !important;
    }

    /* SIDEBAR */
    .sidebar {
      height: calc(100vh - 56px);
      background: rgba(15, 23, 42, 0.95);
      backdrop-filter: blur(10px);
      border-right: 1px solid #1e293b;
      overflow-y: auto;
    }

    /* MAP AREA */
    #map {
      height: calc(100vh - 56px);
      width: 100%;
      background: #020617;
    }

    /* GLASS EFFECT PANELS */
    .glass {
      background: rgba(30, 41, 59, 0.6);
      backdrop-filter: blur(12px);
      border-radius: 12px;
      padding: 15px;
      margin-bottom: 15px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.4);
      border: 1px solid rgba(255,255,255,0.05);
    }

    .legend-color {
      width: 18px;
      height: 18px;
      display: inline-block;
      margin-right: 8px;
      border-radius: 4px;
    }

    /* FLOATING TOOLS (Right) */
    .map-tools {
      position: absolute;
      right: 20px;
      top: 20px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      z-index: 1000;
    }

    .tool-btn {
      width: 44px;
      height: 44px;
      background: rgba(30, 41, 59, 0.8);
      border: 1px solid #334155;
      color: white;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s;
    }

    .tool-btn:hover {
      background: #334155;
      color: #facc15;
    }

    /* HOME BUTTON (Positioned precisely under Leaflet Zoom) */
    .map-home-control {
      position: absolute;
      top: 80px; 
      left: 12px;
      z-index: 1000;
    }

    .home-btn {
      width: 34px;
      height: 34px;
      background-color: #1e293b;
      border: 1px solid #334155;
      color: white;
      border-radius: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: 0 1px 5px rgba(0,0,0,0.4);
      transition: all 0.2s;
    }

    .home-btn:hover {
      background-color: #334155;
      color: #facc15;
    }

    /* Match Leaflet UI to Theme */
    .leaflet-bar a {
      background-color: #1e293b !important;
      color: white !important;
      border-bottom: 1px solid #334155 !important;
    }
    .leaflet-bar a:hover {
      background-color: #334155 !important;
    }

    .data-source {
      font-size: 0.85rem;
      opacity: 0.8;
    }
  </style>
</head>
<body>

<nav class="navbar px-3">
  <div class="d-flex align-items-center">
    <i class="bi bi-geo-alt-fill text-warning me-2 fs-4"></i>
    <span class="navbar-brand">Bhutan Spatial Portal</span>
  </div>

  <button class="btn btn-outline-light btn-sm ms-auto">
    <i class="bi bi-printer"></i> Print Map
  </button>
</nav>

<div class="container-fluid">
  <div class="row">

    <div class="col-md-3 col-lg-2 sidebar p-3">
      <div class="glass">
        <div class="input-group">
          <span class="input-group-text bg-transparent border-secondary text-secondary"><i class="bi bi-search"></i></span>
          <input type="text" class="form-control bg-transparent border-secondary text-white shadow-none" placeholder="Search...">
        </div>
      </div>

      <div class="glass">
        <h6 class="text-uppercase small fw-bold mb-3" style="color: #94a3b8;">Legend</h6>
        <p class="mb-2 small"><span class="legend-color" style="background:#dc2626"></span> > 500</p>
        <p class="mb-2 small"><span class="legend-color" style="background:#f97316"></span> 250 - 500</p>
        <p class="mb-2 small"><span class="legend-color" style="background:#facc15"></span> 100 - 250</p>
        <p class="mb-2 small"><span class="legend-color" style="background:#84cc16"></span> 10 - 100</p>
        <p class="mb-2 small"><span class="legend-color" style="background:#22c55e"></span> < 10</p>
        <p class="mb-0 small"><span class="legend-color" style="background:#9ca3af"></span> No Data</p>
      </div>

      <div class="glass data-source">
        <p class="mb-1"><strong>Source:</strong> NSB, BBS, MoAF</p>
        <p class="mb-0 text-secondary">Updated: May 23, 2025</p>
      </div>
    </div>

    <div class="col-md-9 col-lg-10 p-0 position-relative">
      <div id="map"></div>

      <div class="map-home-control">
        <button class="home-btn" onclick="zoomToBhutan()" title="Zoom to Bhutan">
          <i class="bi bi-house-door-fill"></i>
        </button>
      </div>

      <div class="map-tools">
        <button class="tool-btn" title="Measure Distance"><i class="bi bi-rulers"></i></button>
        <button class="tool-btn" title="Measure Area"><i class="bi bi-bounding-box"></i></button>
        <button class="tool-btn" title="Locate Me"><i class="bi bi-crosshair"></i></button>
      </div>
    </div>

  </div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<script src="ThematicMap.js"></script>

</body>
</html>
